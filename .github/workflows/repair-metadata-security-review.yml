name: Repair product metadata security review
on:
  push:
    branches:
      - fix/factory-product-metadata-evidence-20260905
    paths:
      - .github/workflows/repair-metadata-security-review.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.17.0'
      - run: pnpm install --frozen-lockfile
      - name: Apply security review repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/repair_metadata_security_review.py
          pnpm exec prettier --write src/server/tools/webFetch.ts src/server/tools/competitiveIntelligence.ts src/server/__tests__/oversizedProductMetadataEvidence.test.ts
          git diff --check
      - name: Verify focused and full release contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run src/server/__tests__/oversizedProductMetadataEvidence.test.ts src/server/__tests__/competitiveIntelligence.test.ts src/server/__tests__/webResearch.test.ts
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm release:check
      - name: Publish verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-metadata-security-review.yml .github/scripts/repair_metadata_security_review.py
          git add src/server/tools/webFetch.ts src/server/tools/competitiveIntelligence.ts src/server/__tests__/oversizedProductMetadataEvidence.test.ts .github/workflows/repair-metadata-security-review.yml .github/scripts/repair_metadata_security_review.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate truncated metadata verification from page evidence'
          git push origin HEAD:fix/factory-product-metadata-evidence-20260905
