name: PR 89 one-shot formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr89-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.number == 89 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mandatory-production-readiness-brains'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/mandatory-production-readiness-brains
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.0
      - run: pnpm install --frozen-lockfile
      - name: Format readiness implementation
        shell: bash
        run: |
          pnpm exec prettier --write \
            src/cli/factory.ts \
            src/server/agents/productionReadinessAgent.ts \
            src/server/__tests__/foundryReadinessPolicy.test.ts \
            src/server/__tests__/productionReadinessAgent.test.ts \
            src/server/__tests__/productionReadinessPolicy.test.ts \
            src/server/__tests__/readinessBrainFloor.test.ts \
            src/server/__tests__/readinessStore.test.ts \
            src/server/config.ts \
            src/server/foundry/readinessPolicy.ts \
            src/server/orchestrator/completeProductionReadiness.ts \
            src/server/orchestrator/productionReadinessPolicy.ts \
            src/server/providers/readinessBrains.ts \
            src/server/storage/readinessStore.ts
      - name: Commit formatter output only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'factory-readiness-formatter'
          git config user.email 'factory-readiness-formatter@users.noreply.github.com'
          git add -- \
            src/cli/factory.ts \
            src/server/agents/productionReadinessAgent.ts \
            src/server/__tests__/foundryReadinessPolicy.test.ts \
            src/server/__tests__/productionReadinessAgent.test.ts \
            src/server/__tests__/productionReadinessPolicy.test.ts \
            src/server/__tests__/readinessBrainFloor.test.ts \
            src/server/__tests__/readinessStore.test.ts \
            src/server/config.ts \
            src/server/foundry/readinessPolicy.ts \
            src/server/orchestrator/completeProductionReadiness.ts \
            src/server/orchestrator/productionReadinessPolicy.ts \
            src/server/providers/readinessBrains.ts \
            src/server/storage/readinessStore.ts
          git commit -m 'style(readiness): apply repository formatter'
          git push origin HEAD:feat/mandatory-production-readiness-brains
