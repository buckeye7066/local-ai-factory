name: Harden product metadata evidence to head scope
on:
  push:
    branches:
      - fix/factory-product-metadata-evidence-20260905
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.17.0'
      - run: pnpm install --frozen-lockfile
      - name: Constrain bounded metadata to document head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          web_path = Path("src/server/tools/webFetch.ts")
          web = web_path.read_text()
          old = '''  const values: string[] = [];
            let cursor = 0;
            for (
              let markup = nextHtmlMarkup(html, cursor, false);
              markup;
              markup = nextHtmlMarkup(html, cursor, false)
            ) {
              cursor = markup.end;
              if (markup.closing || markup.tag !== "meta" || !markup.raw.trimEnd().endsWith(">"))
                continue;'''
          new = '''  const values: string[] = [];
            let cursor = 0;
            let inHead = false;
            let headClosed = false;
            for (
              let markup = nextHtmlMarkup(html, cursor, false);
              markup;
              markup = nextHtmlMarkup(html, cursor, false)
            ) {
              cursor = markup.end;
              if (markup.tag === "head") {
                if (markup.closing) {
                  inHead = false;
                  headClosed = true;
                } else if (!headClosed) {
                  inHead = true;
                }
                continue;
              }
              if (!inHead || headClosed) continue;
              if (markup.closing || markup.tag !== "meta" || !markup.raw.trimEnd().endsWith(">"))
                continue;'''
          old = old.replace("\n            ", "\n  ")
          new = new.replace("\n            ", "\n  ")
          if web.count(old) != 1:
              raise SystemExit(f"webFetch metadata loop anchor count={web.count(old)}")
          web_path.write_text(web.replace(old, new))
          test_path = Path("src/server/__tests__/oversizedProductMetadataEvidence.test.ts")
          test = test_path.read_text()
          anchor = '  it("does not promote an incomplete metadata tag at the byte boundary", async () => {'
          injected = '''  it("ignores product-looking metadata injected outside document head", async () => {
              const html =
                '<html><head><meta property="og:title" content="Todoist"></head><body>' +
                '<meta name="description" content="Todoist helps teams organize tasks projects priorities deadlines recurring work and collaboration across devices">' +
                "x".repeat(220_000) +
                "</body></html>";
              const result = await webFetchTool("https://www.todoist.com/", 15_000, {
                lookup: publicLookup,
                fetch: async () =>
                  new Response(html, { status: 200, headers: { "content-type": "text/html" } }),
              });
              expect(result).toMatchObject({
                truncated: true,
                textExcerpt: "",
                metadataExcerpt: "Todoist",
              });
              expect(
                isMeaningfulProductEvidence(metadataView(result), {
                  candidateKey: "todoist.com",
                  title: "Todoist",
                }),
              ).toBe(false);
            });

          '''
          injected = injected.replace("\n            ", "\n  ")
          if test.count(anchor) != 1:
              raise SystemExit(f"test anchor count={test.count(anchor)}")
          test_path.write_text(test.replace(anchor, injected + anchor))
          PY
          pnpm exec prettier --write src/server/tools/webFetch.ts src/server/__tests__/oversizedProductMetadataEvidence.test.ts
          git diff --check
      - name: Verify focused and full release contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run src/server/__tests__/oversizedProductMetadataEvidence.test.ts src/server/__tests__/competitiveIntelligence.test.ts src/server/__tests__/webResearch.test.ts
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm release:check
      - name: Publish hardened source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-product-metadata-head-scope.yml
          git add src/server/tools/webFetch.ts src/server/__tests__/oversizedProductMetadataEvidence.test.ts .github/workflows/repair-product-metadata-head-scope.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restrict bounded product metadata to document head'
          git push origin HEAD:fix/factory-product-metadata-evidence-20260905
