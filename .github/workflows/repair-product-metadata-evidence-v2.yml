name: Repair oversized product evidence v2
on:
  push:
    branches: [fix/factory-product-metadata-evidence-20260905]
    paths: [.github/workflows/repair-product-metadata-evidence-v2.yml]
permissions:
  contents: write
concurrency:
  group: repair-product-metadata-evidence-v2
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.17.0'
      - run: pnpm install --frozen-lockfile
      - name: Apply metadata-only evidence channel
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(path, oldText, newText) {
            const source = readFileSync(path, 'utf8');
            const count = source.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one patch anchor, found ${count}`);
            writeFileSync(path, source.replace(oldText, newText));
          }
          replaceOnce('src/server/tools/webFetch.ts',
            '  textExcerpt: string;\n  /** True when the response body exceeded the network byte budget. */',
            '  textExcerpt: string;\n  /** Completed document metadata parsed from the bounded HTML prefix. Body visibility rules never consume this field. */\n  metadataExcerpt?: string;\n  /** True when the response body exceeded the network byte budget. */');
          const helper = `\n/** Extract only completed metadata from a bounded HTML prefix. */\nfunction boundedDocumentMetadata(html: string): string {\n  const accepted = new Set([\n    "description", "og:description", "og:title", "twitter:description",\n    "twitter:title", "application-name",\n  ]);\n  const values: string[] = [];\n  let cursor = 0;\n  for (let markup = nextHtmlMarkup(html, cursor, false); markup; markup = nextHtmlMarkup(html, cursor, false)) {\n    cursor = markup.end;\n    if (markup.closing || markup.tag !== "meta" || !markup.raw.trimEnd().endsWith(">")) continue;\n    const attributes = actualTagAttributes(markup.raw);\n    const key = attributes.find(({ name }) => name === "name" || name === "property")?.value.trim().toLowerCase();\n    if (!key || !accepted.has(key)) continue;\n    const content = attributes.find(({ name }) => name === "content")?.value;\n    const normalized = decodeHtmlEntities(content ?? "").replace(/\\s+/g, " ").trim();\n    if (normalized) values.push(normalized);\n  }\n  return [...new Set(values)].join("\\n").slice(0, MAX_EXCERPT);\n}\n`;
          replaceOnce('src/server/tools/webFetch.ts', '\nexport async function webFetchTool(', `${helper}\nexport async function webFetchTool(`);
          replaceOnce('src/server/tools/webFetch.ts',
            '          textExcerpt: "",\n          truncated: true,\n          error: "HTML response exceeded the byte limit and cannot be verified safely.",',
            '          textExcerpt: "",\n          metadataExcerpt: boundedDocumentMetadata(raw),\n          truncated: true,\n          error: "HTML response exceeded the byte limit and cannot be verified safely.",');

          let source = readFileSync('src/server/tools/competitiveIntelligence.ts', 'utf8');
          const anchor = '      const fetched = await webFetchTool(candidate.url);\n      const meaningful = isMeaningfulProductEvidence(fetched, {';
          if ((source.split(anchor).length - 1) !== 1) throw new Error('competitive evidence anchor changed');
          source = source.replace(anchor, `      const fetched = await webFetchTool(candidate.url);\n      // Never reinterpret truncated body text as complete. A separate view may\n      // validate completed document metadata because that metadata was itself\n      // wholly present before the byte boundary. Keep the original fetch for\n      // audit/truncation reporting.\n      const evidenceText = fetched.textExcerpt || fetched.metadataExcerpt || "";\n      const metadataOnly =\n        !fetched.ok && fetched.truncated === true && fetched.status >= 200 && fetched.status < 300 && Boolean(fetched.metadataExcerpt);\n      const evidenceFetch = metadataOnly\n        ? { ...fetched, ok: true, textExcerpt: evidenceText, truncated: false, error: undefined }\n        : fetched;\n      const meaningful = isMeaningfulProductEvidence(evidenceFetch, {`);
          const callbackStart = source.indexOf('const evidenceText = fetched.textExcerpt || fetched.metadataExcerpt || "";');
          const callbackEnd = source.indexOf('\n    },\n  );', callbackStart);
          if (callbackStart < 0 || callbackEnd < callbackStart) throw new Error('product callback bounds changed');
          const before = source.slice(0, callbackStart);
          let block = source.slice(callbackStart, callbackEnd);
          block = block.replaceAll('fetched.textExcerpt', 'evidenceText');
          block = block.replace('const evidenceText = evidenceText || fetched.metadataExcerpt || "";', 'const evidenceText = fetched.textExcerpt || fetched.metadataExcerpt || "";');
          source = before + block + source.slice(callbackEnd);
          writeFileSync('src/server/tools/competitiveIntelligence.ts', source);

          writeFileSync('src/server/__tests__/oversizedProductMetadataEvidence.test.ts', `import { describe, expect, it } from "vitest";\nimport { webFetchTool } from "../tools/webFetch.js";\nimport { isMeaningfulProductEvidence } from "../tools/competitiveIntelligence.js";\n\nconst publicLookup = async () => [{ address: "93.184.216.34", family: 4 }] as const;\nconst metadataView = (result: Awaited<ReturnType<typeof webFetchTool>>) => ({\n  ...result, ok: true, textExcerpt: result.metadataExcerpt ?? "", truncated: false, error: undefined,\n});\n\ndescribe("oversized product metadata evidence", () => {\n  it("keeps truncated body fail-closed while completed metadata can prove product identity", async () => {\n    const description = "Todoist helps people organize tasks, projects, deadlines, recurring work, priorities, completed tasks, and collaborative productivity workflows across devices.";\n    const html = '<html><head><meta property="og:title" content="Todoist task manager"><meta name="description" content="' + description + '"></head><body>' + "x".repeat(220_000) + '<div style="display:none">untrusted suffix</div></body></html>';\n    const result = await webFetchTool("https://www.todoist.com/", 15_000, { lookup: publicLookup, fetch: async () => new Response(html, { status: 200, headers: { "content-type": "text/html" } }) });\n    expect(result).toMatchObject({ ok: false, status: 200, truncated: true, textExcerpt: "" });\n    expect(isMeaningfulProductEvidence({ ...result, ok: true, textExcerpt: result.metadataExcerpt ?? "" }, { candidateKey: "todoist.com", title: "Todoist task manager", url: "https://www.todoist.com/" })).toBe(false);\n    expect(result.metadataExcerpt).toContain("Todoist");\n    expect(result.metadataExcerpt).not.toContain("untrusted suffix");\n    expect(isMeaningfulProductEvidence(metadataView(result), { candidateKey: "todoist.com", title: "Todoist task manager", url: "https://www.todoist.com/" })).toBe(true);\n  });\n\n  it("does not promote an incomplete metadata tag at the byte boundary", async () => {\n    const prefix = '<html><head><meta property="og:title" content="Todoist"><meta name="description" content="';\n    const html = prefix + "claim".repeat(60_000);\n    const result = await webFetchTool("https://www.todoist.com/", 15_000, { lookup: publicLookup, fetch: async () => new Response(html, { status: 200, headers: { "content-type": "text/html" } }) });\n    expect(result).toMatchObject({ truncated: true, textExcerpt: "", metadataExcerpt: "Todoist" });\n    expect(isMeaningfulProductEvidence(metadataView(result), { candidateKey: "todoist.com", title: "Todoist", url: "https://www.todoist.com/" })).toBe(false);\n  });\n});\n`);
          JS
          pnpm exec prettier --write src/server/tools/webFetch.ts src/server/tools/competitiveIntelligence.ts src/server/__tests__/oversizedProductMetadataEvidence.test.ts
          git diff --check
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run src/server/__tests__/oversizedProductMetadataEvidence.test.ts src/server/__tests__/competitiveIntelligence.test.ts src/server/__tests__/webResearch.test.ts
          pnpm typecheck
      - name: Full release verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm test
          pnpm build
          pnpm release:check
      - name: Publish verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-product-metadata-evidence-20260905.yml .github/workflows/repair-product-metadata-evidence-v2.yml
          git add src/server/tools/webFetch.ts src/server/tools/competitiveIntelligence.ts src/server/__tests__/oversizedProductMetadataEvidence.test.ts .github/workflows/repair-product-metadata-evidence-20260905.yml .github/workflows/repair-product-metadata-evidence-v2.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verify oversized product pages from bounded metadata'
          git push origin HEAD:fix/factory-product-metadata-evidence-20260905
