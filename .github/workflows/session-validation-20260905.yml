name: Repair and verify startup and crash recovery
on:
  push:
    branches: [repair/production-session-20260905]
    paths: [.github/workflows/session-validation-20260905.yml]
permissions:
  contents: write
concurrency:
  group: session-startup-health-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.17.0'
      - run: pnpm install --frozen-lockfile
      - name: Prove startup and crash-recovery defects with real processes
        shell: bash
        run: |
          mkdir -p session-evidence
          set +e
          pnpm exec vitest run src/server/__tests__/existingInstanceHealth.test.ts src/server/__tests__/processFileLockCrashRecovery.test.ts --reporter=json --outputFile=session-evidence/before.json > session-evidence/before.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('session-evidence/before.json', 'utf8'));
          const failed = report.testResults.flatMap(suite => suite.assertionResults).filter(test => test.status === 'failed');
          const expected = ['unhealthy HTTP status', 'redirected health', 'durably ticketed dead owner'];
          if (report.numPassedTests !== 3 || report.numFailedTests !== 3 || failed.length !== 3 || !expected.every(name => failed.some(test => test.fullName.includes(name)))) {
            console.error(JSON.stringify(report, null, 2));
            throw new Error('The baseline did not reproduce exactly the intended three defects.');
          }
          console.log('Confirmed startup status/redirect defects and delayed recovery of a dead lock owner.');
          JS
      - name: Apply only the demonstrated corrections
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(path, old, replacement) {
            const source = readFileSync(path, 'utf8');
            if (source.split(old).length !== 2) throw new Error(`Exact source changed: ${path}`);
            writeFileSync(path, source.replace(old, replacement));
          }
          replaceOnce('src/server/index.ts',
            'const res = await fetch(`http://127.0.0.1:${config.port}/api/health`, {\n          signal: AbortSignal.timeout(2000),\n        });\n        isFactory = isFactoryHealthPayload(await res.json());',
            'const res = await fetch(`http://127.0.0.1:${config.port}/api/health`, {\n          redirect: "error",\n          signal: AbortSignal.timeout(2000),\n        });\n        isFactory = res.ok && isFactoryHealthPayload(await res.json());');
          replaceOnce('src/server/storage/processFileLock.ts',
            '    if (ageMs >= staleGraceMs && !processIsAlive(filename.pid)) {\n      await removeUniqueOwner(path, queue);\n      continue;\n    }\n\n    const ticket = tickets.get(filename.token);',
            '    const ticket = tickets.get(filename.token);\n    // A complete receipt with a durable ticket is uniquely owned. Once its\n    // process is confirmed dead, no grace period can make that owner resume.\n    // Reclaim it before bounded callers time out, while retaining the grace\n    // for incomplete receipts and never preempting a live or unknown process.\n    const publishedOwner = receipt !== null && ticket !== undefined;\n    if ((publishedOwner || ageMs >= staleGraceMs) && !processIsAlive(filename.pid)) {\n      await removeUniqueOwner(path, queue);\n      continue;\n    }');
          JS
          pnpm exec prettier --write src/server/index.ts src/server/storage/processFileLock.ts src/server/__tests__/existingInstanceHealth.test.ts src/server/__tests__/processFileLockCrashRecovery.test.ts
          rm .github/workflows/session-validation-20260905.yml
          git add src/server/index.ts src/server/storage/processFileLock.ts src/server/__tests__/existingInstanceHealth.test.ts src/server/__tests__/processFileLockCrashRecovery.test.ts .github/workflows/session-validation-20260905.yml
          git diff --cached --check
          git diff --cached > session-evidence/correction.patch
      - name: Verify crash recovery and existing cross-process serialization
        shell: bash
        run: |
          pnpm exec vitest run src/server/__tests__/existingInstanceHealth.test.ts src/server/__tests__/processFileLockCrashRecovery.test.ts src/server/__tests__/processFileLock.test.ts --reporter=json --outputFile=session-evidence/after.json
      - name: Verify every repository release command
        shell: bash
        run: |
          set +e
          result=0
          for script in typecheck lint test build release:check; do
            log=${script//:/-}
            pnpm run "$script" > "session-evidence/$log.log" 2>&1
            code=$?
            printf '%s exit=%s\n' "$script" "$code" | tee -a session-evidence/results.txt
            tail -n 80 "session-evidence/$log.log"
            if [ "$code" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Publish verified source without temporary workflow machinery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: validate existing-instance health and recover dead lock owners promptly'
          git push origin HEAD:repair/production-session-20260905
          git rev-parse HEAD > session-evidence/source-sha.txt
          git archive --format=tar.gz HEAD > session-evidence/source.tar.gz
      - name: Retain full regression and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-session-fixed-evidence
          path: session-evidence/
          retention-days: 3
          if-no-files-found: error
