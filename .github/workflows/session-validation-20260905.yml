name: Session production validation
on:
  push:
    branches: [repair/production-session-20260905]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-production-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact tracked source
        shell: bash
        run: |
          mkdir -p session-evidence
          git rev-parse HEAD > session-evidence/source-sha.txt
          git archive --format=tar.gz HEAD > session-evidence/source.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.17.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute real release commands and preserve failures
        shell: bash
        run: |
          set +e
          result=0
          for script in typecheck lint test build release:check; do
            log=${script//:/-}
            pnpm run "$script" > "session-evidence/$log.log" 2>&1
            code=$?
            printf '%s exit=%s\n' "$script" "$code" | tee -a session-evidence/results.txt
            tail -n 100 "session-evidence/$log.log"
            if [ "$code" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Retain exact source and full test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-session-source-and-checks
          path: session-evidence/
          if-no-files-found: error
          retention-days: 1
