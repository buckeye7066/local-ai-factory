name: final-audit-integration

on:
  push:
    branches:
      - audit/final-zero-known-defects-20260903
    paths:
      - .github/workflows/final-audit-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - name: Three-way merge only platform-evidence files
        shell: bash
        run: |
          set -euo pipefail
          BASE=61973022ea250211089c2ee6935cce9c2f84b1c6
          OTHER=2be31c639b5813c864abfb363aa8a83e14fb32c5
          files=(
            scripts/ci/windows-proof-launcher.ps1
            src/cli/factory-platform-proof.ts
            src/server/__tests__/acceptanceGate.test.ts
            src/server/__tests__/checkpointEvidenceBounds.test.ts
            src/server/__tests__/commandSandbox.test.ts
            src/server/__tests__/commandShellSafety.test.ts
            src/server/__tests__/competitiveEvidence.test.ts
            src/server/__tests__/directTestEvidence.test.ts
            src/server/__tests__/foundry.test.ts
            src/server/__tests__/platformEvidenceRunner.test.ts
            src/server/__tests__/verificationCommands.test.ts
            src/server/__tests__/verificationSandbox.test.ts
            src/server/__tests__/webResearch.test.ts
            src/server/agents/researchAgent.ts
            src/server/foundry/adapters.ts
            src/server/orchestrator/acceptanceGate.ts
            src/server/orchestrator/checkpoint.ts
            src/server/orchestrator/competitiveEvidence.ts
            src/server/orchestrator/directTestEvidence.ts
            src/server/orchestrator/qaGrounding.ts
            src/server/orchestrator/runFactory.ts
            src/server/storage/runsStore.ts
            src/server/workspace/commandRunner.ts
            src/server/workspace/platformEvidenceRunner.ts
            src/server/workspace/verificationCommands.ts
            src/server/workspace/verificationSandbox.ts
            src/shared/schemas.ts
          )
          conflicts=()
          mkdir -p .audit-merge
          for file in "${files[@]}"; do
            other_tmp=$(mktemp .audit-merge/other.XXXXXX)
            base_tmp=$(mktemp .audit-merge/base.XXXXXX)
            merged_tmp=$(mktemp .audit-merge/merged.XXXXXX)
            if ! git show "$OTHER:$file" > "$other_tmp" 2>/dev/null; then
              echo "Reviewed platform head has no $file; skipping"
              rm -f "$other_tmp" "$base_tmp" "$merged_tmp"
              continue
            fi
            if git show "$BASE:$file" > "$base_tmp" 2>/dev/null; then
              if [[ ! -f "$file" ]]; then
                echo "Current main deleted $file while platform branch changed it: conflict"
                conflicts+=("$file")
              else
                set +e
                git merge-file -p "$file" "$base_tmp" "$other_tmp" > "$merged_tmp"
                status=$?
                set -e
                if [[ $status -eq 0 ]]; then
                  cat "$merged_tmp" > "$file"
                else
                  echo "Three-way conflict: $file"
                  conflicts+=("$file")
                fi
              fi
            else
              if [[ -e "$file" ]]; then
                if ! cmp -s "$file" "$other_tmp"; then
                  echo "Both sides independently added $file: conflict"
                  conflicts+=("$file")
                fi
              else
                mkdir -p "$(dirname "$file")"
                cat "$other_tmp" > "$file"
              fi
            fi
            rm -f "$other_tmp" "$base_tmp" "$merged_tmp"
          done
          rm -rf .audit-merge
          if (( ${#conflicts[@]} > 0 )); then
            printf 'Focused integration conflicts:\n - %s\n' "${conflicts[@]}" >&2
            exit 1
          fi
      - name: Repair preserved malformed verification block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/workspace/verificationCommands.ts')
          text = path.read_text()
          bad = '  return {\\n    bin: manager,\\n    args,\\n    isTest: true,\\n    ...(pinCandidateRoot ? { runner: "vitest" as const } : {}),\\n  };'
          good = '''  return {
            bin: manager,
            args,
            isTest: true,
            ...(pinCandidateRoot ? { runner: "vitest" as const } : {}),
          };'''
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'expected exactly one malformed verification return, found {count}')
          path.write_text(text.replace(bad, good, 1))
          PY
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Format merged TypeScript only
        shell: bash
        run: |
          changed=$(git diff --name-only -- 'src/**/*.ts' 'src/**/*.tsx' || true)
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed" | xargs pnpm exec prettier --write
          fi
      - name: Typecheck merged platform surface
        run: pnpm typecheck
      - name: Run focused platform and orchestration regression suite
        run: >-
          pnpm vitest run
          src/server/__tests__/acceptanceGate.test.ts
          src/server/__tests__/checkpointEvidenceBounds.test.ts
          src/server/__tests__/commandSandbox.test.ts
          src/server/__tests__/commandShellSafety.test.ts
          src/server/__tests__/competitiveEvidence.test.ts
          src/server/__tests__/directTestEvidence.test.ts
          src/server/__tests__/factoryDeckCloudWorkflow.test.ts
          src/server/__tests__/foundry.test.ts
          src/server/__tests__/platformEvidenceRunner.test.ts
          src/server/__tests__/verificationCommands.test.ts
          src/server/__tests__/verificationSandbox.test.ts
          src/server/__tests__/webResearch.test.ts
      - name: Publish clean focused integration baseline
        shell: bash
        run: |
          git config user.name "Factory Deck Audit"
          git config user.email "factory-deck-audit@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No platform evidence changes were produced." >&2
            exit 1
          fi
          git commit -m "Integrate platform evidence without regressing current main"
          git push origin HEAD:audit/final-zero-known-defects-20260903
