name: final-issue173-repair

on:
  push:
    branches:
      - audit/final-zero-known-defects-20260903
    paths:
      - .github/workflows/final-issue173-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Apply six code-level issue 173 repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path, before, after):
              p = Path(path)
              text = p.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact anchor, found {count}')
              p.write_text(text.replace(before, after, 1))

          # #1 Preserve candidate-owned Vitest --config in direct mandatory runs.
          exact(
              'src/server/workspace/verificationCommands.ts',
              '''interface VitestScript {
            root: string;
            ownsRoot: boolean;
          }''',
              '''interface VitestScript {
            root: string;
            ownsRoot: boolean;
            config?: string;
          }''',
          )
          exact(
              'src/server/workspace/verificationCommands.ts',
              '''  let root: string | undefined;
            const seenPathOptions = new Set<string>();''',
              '''  let root: string | undefined;
            let config: string | undefined;
            const seenPathOptions = new Set<string>();''',
          )
          exact(
              'src/server/workspace/verificationCommands.ts',
              '''    if (option === "--root") root = normalized;
            }
            return { root: root ?? ".", ownsRoot: root !== undefined };''',
              '''    if (option === "--root") root = normalized;
              if (option === "--config") config = normalized;
            }
            return { root: root ?? ".", ownsRoot: root !== undefined, config };''',
          )
          exact(
              'src/server/workspace/verificationCommands.ts',
              '''          testPath,
                    "--reporter=json",
                    `--root=${root}`,''',
              '''          testPath,
                    ...(vitestScript?.config ? [`--config=${vitestScript.config}`] : []),
                    "--reporter=json",
                    `--root=${root}`,''',
          )

          runner = Path('src/server/workspace/commandRunner.ts')
          text = runner.read_text()
          exact_root = '''function isSafeVitestRoot(arg: string): boolean {
            if (!arg.startsWith("--root=")) return false;
            return normalizeSafeRelativePath(arg.slice("--root=".length)) !== null;
          }
          '''
          config_root = exact_root + '''
          function isSafeVitestConfig(arg: string): boolean {
            if (!arg.startsWith("--config=")) return false;
            return normalizeSafeRelativePath(arg.slice("--config=".length)) !== null;
          }
          '''
          if text.count(exact_root) != 1:
              raise SystemExit('commandRunner: Vitest root helper anchor mismatch')
          text = text.replace(exact_root, config_root, 1)
          vitest = re.compile(r'  if \(tool === "vitest"\) \{\n.*?\n  \}\n(?=  if \(tool === "jest"\) \{)', re.S)
          replacement = '''  if (tool === "vitest") {
            const maybeConfig = args[4]?.startsWith("--config=") ? args[4] : null;
            const reporterIndex = maybeConfig ? 5 : 4;
            const rootIndex = maybeConfig ? 6 : 5;
            const platformConfigIndex = maybeConfig ? 7 : 6;
            return (
              (args.length === platformConfigIndex ||
                (args.length === platformConfigIndex + 1 &&
                  args[platformConfigIndex] ===
                    "--config=.factory-deck-platform-vitest.config.mjs")) &&
              args[2] === "run" &&
              isSafeDirectJsTest(args[3]!) &&
              (!maybeConfig || isSafeVitestConfig(maybeConfig)) &&
              args[reporterIndex] === "--reporter=json" &&
              isSafeVitestRoot(args[rootIndex]!)
            );
          }
          '''
          text, count = vitest.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'commandRunner: Vitest grammar replacements={count}')
          runner.write_text(text)

          # #2 Bound ProductSpec user-flow + acceptance requirement universe to 256 total.
          exact(
              'src/shared/schemas.ts',
              '''const NonEmptyStringListSchema = z.preprocess(
            coerceStringList,
            z.array(z.string()).min(1),
          );''',
              '''const NonEmptyStringListSchema = z.preprocess(
            coerceStringList,
            z.array(z.string()).min(1),
          );
          const RequirementStringListSchema = z.preprocess(
            coerceStringList,
            z.array(z.string()).max(128),
          );
          const NonEmptyRequirementStringListSchema = z.preprocess(
            coerceStringList,
            z.array(z.string()).min(1).max(128),
          );''',
          )
          exact(
              'src/shared/schemas.ts',
              '''  userFlows: StringListSchema.default([]),
            acceptanceCriteria: NonEmptyStringListSchema,''',
              '''  userFlows: RequirementStringListSchema.default([]),
            acceptanceCriteria: NonEmptyRequirementStringListSchema,''',
          )

          # #4 Targeted competitor fallback can inspect all verified products.
          research = Path('src/server/agents/researchAgent.ts')
          text = research.read_text()
          old = '''function reviewableProductCandidates(dossier: CompetitiveDossier) {
            const productTarget = Math.max(
              MIN_PRODUCT_COMPETITORS,
              dossier.coverage?.productTarget ?? MIN_PRODUCT_COMPETITORS,
            );
            const candidates = dossier.candidates
              .filter(
                (candidate) =>
                  candidate.kind === "product" &&
                  !candidate.inspectionError &&
                  candidate.sourceEvidence.length > 0 &&
                  canonicalEvidenceUrlSet([
                    candidate.url,
                    ...candidate.sourceEvidence.map((item) => item.url),
                  ]).size > 0,
              )
              .slice(0, productTarget + COMPETITIVE_REVIEW_HEADROOM);
            return {
              candidates,
              requiredCount: Math.min(productTarget, candidates.length),
            };
          }'''
          new = '''export function reviewableProductCandidates(dossier: CompetitiveDossier) {
            const productTarget = Math.max(
              MIN_PRODUCT_COMPETITORS,
              dossier.coverage?.productTarget ?? MIN_PRODUCT_COMPETITORS,
            );
            const candidates = dossier.candidates.filter(
              (candidate) =>
                candidate.kind === "product" &&
                !candidate.inspectionError &&
                candidate.sourceEvidence.length > 0 &&
                canonicalEvidenceUrlSet([
                  candidate.url,
                  ...candidate.sourceEvidence.map((item) => item.url),
                ]).size > 0,
            );
            return {
              candidates,
              requiredCount: Math.min(productTarget, candidates.length),
            };
          }'''
          if text.count(old) != 1:
              raise SystemExit('researchAgent: reviewable candidate anchor mismatch')
          text = text.replace(old, new, 1)
          collective = '''  const { candidates, requiredCount } = reviewableProductCandidates(dossier);
            if (requiredCount === 0) {'''
          collective_new = '''  const { candidates, requiredCount } = reviewableProductCandidates(dossier);
            const reviewCandidates = candidates.slice(
              0,
              requiredCount + COMPETITIVE_REVIEW_HEADROOM,
            );
            if (requiredCount === 0) {'''
          if text.count(collective) < 2:
              raise SystemExit('researchAgent: expected collective and targeted candidate anchors')
          text = text.replace(collective, collective_new, 1)
          text = text.replace(
              '`VERIFIED PRODUCT DOSSIER:\\n${JSON.stringify(candidates.map(compactProductCandidate))}`',
              '`VERIFIED PRODUCT DOSSIER:\\n${JSON.stringify(reviewCandidates.map(compactProductCandidate))}`',
              1,
          )
          text = text.replace(
              '(raw) => hydrateCompetitiveCandidateIds(raw, candidates),\n      competitiveSelectionSchema(candidates, requiredCount),',
              '(raw) => hydrateCompetitiveCandidateIds(raw, reviewCandidates),\n      competitiveSelectionSchema(reviewCandidates, requiredCount),',
              1,
          )
          research.write_text(text)

          # #5 Every mapped acceptance title must independently pass on the current host.
          exact(
              'src/server/workspace/platformEvidenceRunner.ts',
              'import { mappedTestNamesForPath } from "../orchestrator/acceptanceGate.js";',
              '''import {
            assessExecutedCoverage,
            mappedTestNamesForPath,
          } from "../orchestrator/acceptanceGate.js";''',
          )
          exact(
              'src/server/workspace/platformEvidenceRunner.ts',
              '''export function missingDirectPlatformEvidencePaths(
            requiredPaths: readonly string[],''',
              '''export function mappedPlatformCoverageErrors(
            testPlan: FactoryCheckpoint["testPlan"],
            evidence: CheckpointExecutedCommand[],
          ): string[] {
            return testPlan ? assessExecutedCoverage(testPlan, evidence) : [];
          }

          export function missingDirectPlatformEvidencePaths(
            requiredPaths: readonly string[],''',
          )
          exact(
              'src/server/workspace/platformEvidenceRunner.ts',
              '''    if (missingDirectEvidence.length > 0) {
              throw new Error(
                `${hostPlatform} proof did not produce current structured evidence for every generated test: ${missingDirectEvidence.join(
                  ", ",
                )}.`,
              );
            }

            const after = await verifyFileDigests''',
              '''    if (missingDirectEvidence.length > 0) {
              throw new Error(
                `${hostPlatform} proof did not produce current structured evidence for every generated test: ${missingDirectEvidence.join(
                  ", ",
                )}.`,
              );
            }
            const mappedCoverageErrors = mappedPlatformCoverageErrors(
              held.checkpoint.testPlan,
              executed,
            );
            if (mappedCoverageErrors.length > 0) {
              throw new Error(
                `${hostPlatform} proof did not independently pass every mapped acceptance test: ${mappedCoverageErrors.join(
                  "; ",
                )}.`,
              );
            }

            const after = await verifyFileDigests''',
          )

          # #6 Preserve own prototype-named keys in file digest receipts too.
          checkpoint = Path('src/server/orchestrator/checkpoint.ts')
          text = checkpoint.read_text()
          text = text.replace('const PlatformArtifactSnapshotSchema = z', 'const OwnStringRecordSchema = z', 1)
          text = text.replace('"expected an artifact snapshot object"', '"expected a string-record object"', 1)
          text = text.replace('const snapshot = Object.create(null) as Record<string, string>;', 'const snapshot = Object.create(null) as Record<string, string>;', 1)
          text = text.replace('message: "expected an artifact fingerprint string",', 'message: "expected a string value",', 1)
          if text.count('fileDigests: z.record(z.string()).optional(),') != 1:
              raise SystemExit('checkpoint: fileDigests schema anchor mismatch')
          text = text.replace('fileDigests: z.record(z.string()).optional(),', 'fileDigests: OwnStringRecordSchema.optional(),', 1)
          if text.count('platformArtifactSnapshot: PlatformArtifactSnapshotSchema.optional(),') != 1:
              raise SystemExit('checkpoint: platform snapshot schema anchor mismatch')
          text = text.replace('platformArtifactSnapshot: PlatformArtifactSnapshotSchema.optional(),', 'platformArtifactSnapshot: OwnStringRecordSchema.optional(),', 1)
          checkpoint.write_text(text)

          # #7 Windows launcher must stream child output rather than ReadToEnd buffering it.
          exact(
              'scripts/ci/windows-proof-launcher.ps1',
              '''  $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true''',
              '''  # Inherit job output handles so untrusted child output is streamed rather than buffered in memory.
            $psi.RedirectStandardOutput = $false
            $psi.RedirectStandardError = $false''',
          )
          exact(
              'scripts/ci/windows-proof-launcher.ps1',
              '''  $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            [Console]::Out.Write($stdout.GetAwaiter().GetResult())
            [Console]::Error.Write($stderr.GetAwaiter().GetResult())
            exit $process.ExitCode''',
              '''  $process.WaitForExit()
            exit $process.ExitCode''',
          )
          PY

      - name: Add regression coverage for issue 173
        shell: bash
        run: |
          cat > src/server/__tests__/issue173Correctness.test.ts <<'TS'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";
          import { ProductSpecSchema } from "../../shared/schemas.js";
          import { FactoryCheckpointSchema } from "../orchestrator/checkpoint.js";
          import { reviewableProductCandidates } from "../agents/researchAgent.js";
          import { mappedPlatformCoverageErrors } from "../workspace/platformEvidenceRunner.js";

          describe("issue 173 correctness regressions", () => {
            it("bounds the complete product requirement universe to 256 mapped entries", () => {
              const base = {
                appName: "bounded",
                targetUser: "owner",
                coreFeatures: ["feature"],
                dataModel: [],
              };
              expect(
                ProductSpecSchema.safeParse({
                  ...base,
                  userFlows: Array.from({ length: 128 }, (_, i) => `UF ${i}`),
                  acceptanceCriteria: Array.from({ length: 128 }, (_, i) => `AC ${i}`),
                }).success,
              ).toBe(true);
              expect(
                ProductSpecSchema.safeParse({
                  ...base,
                  userFlows: Array.from({ length: 129 }, (_, i) => `UF ${i}`),
                  acceptanceCriteria: ["AC"],
                }).success,
              ).toBe(false);
              expect(
                ProductSpecSchema.safeParse({
                  ...base,
                  userFlows: [],
                  acceptanceCriteria: Array.from({ length: 129 }, (_, i) => `AC ${i}`),
                }).success,
              ).toBe(false);
            });

            it("preserves own __proto__ keys in exact file digest receipts", () => {
              const checkpoint = FactoryCheckpointSchema.parse({
                schemaVersion: 3,
                runId: crypto.randomUUID(),
                idea: "prototype digest",
                options: {},
                verification: {
                  fileDigests: JSON.parse('{"__proto__":"sha256:exact"}'),
                },
                updatedAt: Date.now(),
              });
              const digests = checkpoint.verification!.fileDigests!;
              expect(Object.getPrototypeOf(digests)).toBeNull();
              expect(Object.hasOwn(digests, "__proto__")).toBe(true);
              expect(digests["__proto__"]).toBe("sha256:exact");
            });

            it("keeps every verified product available to targeted fallback", () => {
              const products = Array.from({ length: 10 }, (_, index) => ({
                id: `product-${index}`,
                kind: "product" as const,
                name: `Product ${index}`,
                url: `https://product-${index}.example.com`,
                description: "verified",
                sourceEvidence: [
                  {
                    url: `https://product-${index}.example.com/features`,
                    excerpt: "feature evidence",
                  },
                ],
                license: {
                  spdxId: "NOASSERTION",
                  policy: "reference-only" as const,
                },
                inspectionError: null,
              }));
              const result = reviewableProductCandidates({
                candidates: products,
                coverage: {
                  productTarget: 5,
                  productDiscoveredCount: 10,
                  productInspectedCount: 10,
                  productVerifiedCount: 10,
                  productCoverageMet: true,
                  repositoryDiscoveredCount: 0,
                  repositoryInspectedCount: 0,
                  repositoryVerifiedCount: 0,
                },
              } as never);
              expect(result.requiredCount).toBe(5);
              expect(result.candidates).toHaveLength(10);
            });

            it("rejects platform evidence when a mapped title was not reported passed", () => {
              const errors = mappedPlatformCoverageErrors(
                {
                  testPlan: "mapped",
                  coverage: [
                    {
                      requirementId: "AC-1",
                      testPath: "tests/flow.test.ts",
                      testName: "saves the task",
                      kind: "integration",
                    },
                  ],
                  files: [],
                },
                [
                  {
                    command: "npx vitest",
                    exitCode: 0,
                    directTestPath: "tests/flow.test.ts",
                    directEvidenceValid: true,
                    passedTestNames: ["different title"],
                    outputTail: "",
                    hostPlatform: "win32",
                  },
                ],
              );
              expect(errors.join("\n")).toMatch(/was not reported passed/i);
            });

            it("streams Windows proof output without ReadToEnd memory buffering", () => {
              const launcher = readFileSync("scripts/ci/windows-proof-launcher.ps1", "utf8");
              expect(launcher).not.toContain("ReadToEndAsync");
              expect(launcher).toContain("RedirectStandardOutput = $false");
              expect(launcher).toContain("RedirectStandardError = $false");
            });
          });
          TS

          python - <<'PY'
          from pathlib import Path
          import re

          # Existing Vitest-root regression now must prove config propagation too.
          p = Path('src/server/__tests__/verificationCommands.test.ts')
          text = p.read_text()
          pattern = re.compile(
              r'(it\("preserves a candidate-owned Vitest root for host and direct tests".*?'
              r'"src/profile flow\.test\.ts",\s*)'
              r'("--reporter=json",)',
              re.S,
          )
          text, count = pattern.subn(r'\1"--config=vitest.config.ts",\n        \2', text, count=1)
          if count != 1:
              raise SystemExit(f'verificationCommands config expectation replacements={count}')
          p.write_text(text)

          # Command grammar must admit contained config and reject traversal.
          p = Path('src/server/__tests__/commandSandbox.test.ts')
          text = p.read_text()
          marker = '''    expect(
              isAllowedNpxVerification([
                "--no-install",
                "vitest",
                "run",
                "src/App.test.tsx",
                "--reporter=json",
                "--root=.",
              ]),
            ).toBe(true);'''
          if text.count(marker) != 1:
              raise SystemExit('commandSandbox positive Vitest marker mismatch')
          extra = marker + '''
            expect(
              isAllowedNpxVerification([
                "--no-install",
                "vitest",
                "run",
                "src/App.test.tsx",
                "--config=vitest.config.ts",
                "--reporter=json",
                "--root=.",
              ]),
            ).toBe(true);
            expect(
              isAllowedNpxVerification([
                "--no-install",
                "vitest",
                "run",
                "src/App.test.tsx",
                "--config=../outside.config.ts",
                "--reporter=json",
                "--root=.",
              ]),
            ).toBe(false);'''
          p.write_text(text.replace(marker, extra, 1))
          PY

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Format TypeScript
        run: pnpm exec prettier --write "src/**/*.{ts,tsx}"
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused issue 173 regressions
        run: >-
          pnpm vitest run
          src/server/__tests__/issue173Correctness.test.ts
          src/server/__tests__/verificationCommands.test.ts
          src/server/__tests__/commandSandbox.test.ts
          src/server/__tests__/checkpointEvidenceBounds.test.ts
          src/server/__tests__/platformEvidenceRunner.test.ts
          src/server/__tests__/webResearch.test.ts
      - name: Full unit suite
        run: pnpm test
      - name: Publish verified issue 173 code repairs
        shell: bash
        run: |
          git config user.name "Factory Deck Audit"
          git config user.email "factory-deck-audit@users.noreply.github.com"
          git add -A
          git commit -m "Fix issue 173 cross-platform correctness defects"
          git push origin HEAD:audit/final-zero-known-defects-20260903
