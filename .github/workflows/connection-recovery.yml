name: connection-recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/connection-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: "10.17.0"
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Recovery regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run src/ui/__tests__/connectionRecovery.test.tsx src/ui/__tests__/runResumeRecovery.test.tsx
      - name: Build production UI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vite build
      - name: Check recovery-source formatting with an actionable diff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm exec prettier --write src/ui/App.tsx src/ui/lib/api.ts src/ui/lib/http.ts src/ui/__tests__/connectionRecovery.test.tsx src/ui/__tests__/runResumeRecovery.test.tsx
          git diff --exit-code
