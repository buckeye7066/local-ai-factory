name: restore-runfactory-once
on:
  push:
    branches: [fix/directed-work-theme]
    paths:
      - ".github/workflows/restore-runfactory-once.yml"
      - "scripts/bind_worktheme_runfactory.py"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directed-work-theme
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore runFactory from main and bind WorkTheme
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/server/orchestrator/runFactory.ts > src/server/orchestrator/runFactory.ts
          python3 scripts/bind_worktheme_runfactory.py
          rm -f .github/workflows/restore-runfactory-once.yml
          rm -f scripts/bind_worktheme_runfactory.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: restore runFactory.ts and bind withWorkTheme entrypoints"
          git push
