name: restore-runfactory-once
on:
  push:
    branches: [fix/directed-work-theme]
    paths:
      - ".github/workflows/restore-runfactory-once.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directed-work-theme
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore runFactory from main and bind WorkTheme
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/server/orchestrator/runFactory.ts > src/server/orchestrator/runFactory.ts
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/server/orchestrator/runFactory.ts")
          text = p.read_text(encoding="utf-8")
          if text.lstrip().startswith("@file:") or "PLACEHOLDER_RESTORE" in text[:80]:
              raise SystemExit("restore still looks like a stub")
          import_line = 'import { createWorkTheme, withWorkTheme } from "./workTheme.js";\n'
          if "createWorkTheme" not in text:
              anchor = 'import { ingestAdditionalSource } from "./ingestAdditionalSource.js";\n'
              if anchor not in text:
                  raise SystemExit("import anchor missing")
              text = text.replace(anchor, anchor + import_line, 1)
          constraints = """[
      \"Never treat node_modules/, dist/, build/, .next/, out/, or coverage/ as the fix target — edit the source that produced them.\",
      \"Stay on this program's verified failure; do not invent unrelated refactors.\",
    ]"""
          if "withWorkTheme(theme," not in text:
              old_resume = """  void executeRun(prepared.run, prepared.args, prepared.checkpoint).catch(async (err) => {
    await restoreFailedResume(prepared.run, err).catch(() => {});
  });
  return prepared.run;
}"""
              new_resume = f"""  const theme = createWorkTheme({{
    idea: prepared.args.idea,
    appName: prepared.run.appName,
    stage: prepared.args.options.mode === \"extend\" ? \"extend\" : \"build\",
    constraints: {constraints},
  }});
  void withWorkTheme(theme, () =>
    executeRun(prepared.run, prepared.args, prepared.checkpoint),
  ).catch(async (err) => {{
    await restoreFailedResume(prepared.run, err).catch(() => {{}});
  }});
  return prepared.run;
}}"""
              if old_resume not in text:
                  raise SystemExit("resumeRun pattern not found")
              text = text.replace(old_resume, new_resume, 1)

              old_rf = """export async function resumeFactory(
  runId: string,
  config: AppConfig,
  secrets: AppSecrets,
): Promise<RunRecord> {
  const prepared = await prepareResume(runId, config, secrets);
  try {
    await executeRun(prepared.run, prepared.args, prepared.checkpoint);
  } catch (err) {
    await restoreFailedResume(prepared.run, err);
    throw err;
  }
  return prepared.run;
}"""
              new_rf = f"""export async function resumeFactory(
  runId: string,
  config: AppConfig,
  secrets: AppSecrets,
): Promise<RunRecord> {{
  const prepared = await prepareResume(runId, config, secrets);
  const theme = createWorkTheme({{
    idea: prepared.args.idea,
    appName: prepared.run.appName,
    stage: prepared.args.options.mode === \"extend\" ? \"extend\" : \"build\",
    constraints: {constraints},
  }});
  try {{
    await withWorkTheme(theme, () =>
      executeRun(prepared.run, prepared.args, prepared.checkpoint),
    );
  }} catch (err) {{
    await restoreFailedResume(prepared.run, err);
    throw err;
  }}
  return prepared.run;
}}"""
              if old_rf not in text:
                  raise SystemExit("resumeFactory pattern not found")
              text = text.replace(old_rf, new_rf, 1)

              old_start = """export function startRun(args: StartRunArgs): RunRecord {
  const run = createRecord(args);
  putRunInMemory(run);
  void appendAuditEvent({ type: \"run.queued\", runId: run.id });
  void saveRun(run).then(() => executeRun(run, args));
  return run;
}"""
              new_start = f"""export function startRun(args: StartRunArgs): RunRecord {{
  const run = createRecord(args);
  putRunInMemory(run);
  void appendAuditEvent({{ type: \"run.queued\", runId: run.id }});
  const theme = createWorkTheme({{
    idea: args.idea,
    stage: args.options.mode === \"extend\" ? \"extend\" : \"build\",
    constraints: {constraints},
  }});
  void saveRun(run).then(() => withWorkTheme(theme, () => executeRun(run, args)));
  return run;
}}"""
              if old_start not in text:
                  raise SystemExit("startRun pattern not found")
              text = text.replace(old_start, new_start, 1)

              old_factory = """export async function runFactory(args: StartRunArgs): Promise<RunRecord> {
  const run = createRecord(args);
  await appendAuditEvent({ type: \"run.queued\", runId: run.id });
  await saveRun(run);
  await executeRun(run, args);
  return run;
}"""
              new_factory = f"""export async function runFactory(args: StartRunArgs): Promise<RunRecord> {{
  const theme = createWorkTheme({{
    idea: args.idea,
    stage: args.options.mode === \"extend\" ? \"extend\" : \"build\",
    constraints: {constraints},
  }});
  return withWorkTheme(theme, async () => {{
    const run = createRecord(args);
    await appendAuditEvent({{ type: \"run.queued\", runId: run.id }});
    await saveRun(run);
    await executeRun(run, args);
    return run;
  }});
}}"""
              if old_factory not in text:
                  raise SystemExit("runFactory pattern not found")
              text = text.replace(old_factory, new_factory, 1)

              old_tracked = """export async function runFactoryTracked(
  args: StartRunArgs,
  onCreated: (run: RunRecord) => void | Promise<void>,
): Promise<RunRecord> {
  const run = createRecord(args);
  await appendAuditEvent({ type: \"run.queued\", runId: run.id });
  await saveRun(run);
  await onCreated(run);
  await executeRun(run, args);
  return run;
}"""
              new_tracked = f"""export async function runFactoryTracked(
  args: StartRunArgs,
  onCreated: (run: RunRecord) => void | Promise<void>,
): Promise<RunRecord> {{
  const theme = createWorkTheme({{
    idea: args.idea,
    stage: args.options.mode === \"extend\" ? \"extend\" : \"build\",
    constraints: {constraints},
  }});
  return withWorkTheme(theme, async () => {{
    const run = createRecord(args);
    await appendAuditEvent({{ type: \"run.queued\", runId: run.id }});
    await saveRun(run);
    await onCreated(run);
    await executeRun(run, args);
    return run;
  }});
}}"""
              if old_tracked not in text:
                  raise SystemExit("runFactoryTracked pattern not found")
              text = text.replace(old_tracked, new_tracked, 1)
          if "withWorkTheme" not in text or "createWorkTheme" not in text:
              raise SystemExit("WorkTheme bind missing after patch")
          if text.lstrip().startswith("@file:"):
              raise SystemExit("still starts with @file:")
          p.write_text(text, encoding="utf-8")
          print(f"restored+bound runFactory.ts ({len(text)} bytes)")
          PY
          rm -f .github/workflows/restore-runfactory-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: restore runFactory.ts and bind withWorkTheme entrypoints"
          git push
