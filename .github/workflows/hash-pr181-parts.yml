name: Diagnose PR 181 patch transport

on:
  push:
    branches: [fix/factory-purpose-evidence-truth-20260904]
    paths:
      - .github/workflows/hash-pr181-parts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fingerprint transported segments
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/chatgpt-pr181-patch/part-*
          cat .github/chatgpt-pr181-patch/part-* > "$RUNNER_TEMP/repair.raw"
          python3 - "$RUNNER_TEMP/repair.raw" "$RUNNER_TEMP/repair.patch" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = "+diff --git a/src/server/tools/webFetch.ts"
          start = text.index(marker)
          end = text.index("\n-  const zeroSizedAndClipped", start)
          segment = text[start:end]
          segment = "\n".join(
              line[1:] if line.startswith("+") else line
              for line in segment.split("\n")
          )
          Path(sys.argv[2]).write_text(text[:start] + segment + text[end:], encoding="utf-8")
          PY
          sha256sum "$RUNNER_TEMP/repair.raw" "$RUNNER_TEMP/repair.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: pr181-transport-diagnostic
          path: |
            ${{ runner.temp }}/repair.raw
            ${{ runner.temp }}/repair.patch
          retention-days: 1
          if-no-files-found: error
