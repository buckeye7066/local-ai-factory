name: Diagnose PR 181 patch transport

on:
  push:
    branches: [fix/factory-purpose-evidence-truth-20260904]
    paths:
      - .github/workflows/hash-pr181-parts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fingerprint transported segments
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/chatgpt-pr181-patch/part-*
          sha256sum .github/chatgpt-pr181-integration/part-*
          cat .github/chatgpt-pr181-integration/part-* > "$RUNNER_TEMP/integration.patch"
          sha256sum "$RUNNER_TEMP/integration.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: pr181-integration-transport-diagnostic
          path: ${{ runner.temp }}/integration.patch
          retention-days: 1
          if-no-files-found: error
