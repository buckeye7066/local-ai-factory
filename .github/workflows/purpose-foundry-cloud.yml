name: purpose-foundry-cloud
run-name: "Purpose Foundry cloud proof @ ${{ github.sha }} (attempt ${{ github.run_attempt }})"
# A marker-bearing main commit starts the exact paid proof; skipped runs are never evidence.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: Generate exact Purpose Foundry candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[foundry-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build generated-code verification sandbox
        shell: bash
        run: |
          docker build --pull \
            --file scripts/ci/verification-sandbox.Dockerfile \
            --tag "local-ai-factory-verifier:${GITHUB_SHA}" \
            scripts/ci
          mkdir -p "${RUNNER_TEMP}/factory-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run paid production line to the platform hold
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PAID_PRODUCTION_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PAID_PRODUCTION_OPENAI_KEY || secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: claude-fable-5-1
          OPENAI_MODEL: gpt-5.5
          FACTORY_SOL_MODEL: gpt-5.5
          FACTORY_FABLE_OR_OPUS_MODEL: claude-fable-5-1
          FACTORY_FREE_ENABLED: "0"
          DEFAULT_CODE_PROVIDER: anthropic
          DEFAULT_REVIEW_PROVIDER: openai
          FACTORY_VERIFICATION_SANDBOX_IMAGE: "local-ai-factory-verifier:${{ github.sha }}"
          FACTORY_VERIFICATION_SANDBOX_STATE_ROOT: "${{ runner.temp }}/factory-verification-${{ github.run_id }}-${{ github.run_attempt }}"
          ALLOW_UNTRUSTED_SCRIPTS: "true"
          PURPOSE_FOUNDRY_LOCAL_ARTIFACT_ONLY: "true"
          PURPOSE_FOUNDRY_SMOKE_PHASE: seed
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_RUN_TIMEOUT_MS: "19200000"
          PURPOSE_FOUNDRY_FACTORY_TIMEOUT_MS: "19200000"
          PURPOSE_FOUNDRY_SMOKE_TIMEOUT_MS: "19200000"
          MAX_MODEL_CALLS_PER_RUN: "60"
          MAX_REPAIR_LOOPS: "3"
          FACTORY_PAID_RESCUES_PER_HOUR: "60"
          FACTORY_PAID_RESCUES_PER_DAY: "60"
          FACTORY_PAID_MAX_USD_PER_DAY: "35"
          CI: "true"
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "No Anthropic production credential is configured."; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "No OpenAI production credential is configured."; exit 1; }
          setsid pnpm server > purpose-foundry-seed-server.log 2>&1 &
          server_pid=$!
          trap 'kill -- "-$server_pid" 2>/dev/null || true' EXIT
          node scripts/ci/run-purpose-foundry-smoke.mjs

      - name: Validate platform-only readiness hold
        shell: pwsh
        env:
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
        run: pnpm exec tsx src/cli/factory-platform-proof.ts validate

      - name: Pack immutable candidate with POSIX metadata
        shell: bash
        run: |
          tar --create --file purpose-foundry-workspaces.tar \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/__pycache__' \
            --exclude='*/__pycache__/*' \
            --exclude='*/.pytest_cache' \
            --exclude='*/.pytest_cache/*' \
            --exclude='*/.mypy_cache' \
            --exclude='*/.mypy_cache/*' \
            --exclude='*/.ruff_cache' \
            --exclude='*/.ruff_cache/*' \
            --exclude='*/.hypothesis' \
            --exclude='*/.hypothesis/*' \
            --exclude='*/.tox' \
            --exclude='*/.tox/*' \
            --exclude='*/.nox' \
            --exclude='*/.nox/*' \
            --exclude='*/.nyc_output' \
            --exclude='*/.nyc_output/*' \
            --exclude='*/.coverage' \
            --exclude='*/.coverage.*' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            workspaces

      - name: Preserve exact candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purpose-foundry-seed-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            purpose-foundry-seed-server.log
            .factory/**
            purpose-foundry-workspaces.tar

  windows:
    name: Verify Purpose Foundry candidate on Windows
    needs: seed
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: purpose-foundry-seed-${{ github.run_id }}
          path: .

      - name: Materialize immutable candidate
        shell: pwsh
        run: tar --extract --file purpose-foundry-workspaces.tar

      - name: Isolate untrusted Windows proof
        id: proof_sandbox
        shell: pwsh
        run: |
          $proofUser = "factoryproof"
          $password = [Guid]::NewGuid().ToString("N") + "aA1!"
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $proofUser -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $proofRoot = Join-Path $env:SystemDrive "factory-proof-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sandboxRoot = Join-Path $proofRoot "workspaces"
          $stateRoot = Join-Path $proofRoot "state"
          @($sandboxRoot, $stateRoot) | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }
          @("home", "tmp", "appdata", "localappdata", "cache", "config", "data", "corepack", "pnpm", "npm", "yarn", "pip", "playwright") | ForEach-Object {
            New-Item -ItemType Directory -Force -Path (Join-Path $stateRoot $_) | Out-Null
          }
          & icacls.exe $proofRoot /grant:r "${proofUser}:(RX)" /Q
          if ($LASTEXITCODE -ne 0) { throw "Could not grant proof-root traversal." }
          foreach ($writableRoot in @($sandboxRoot, $stateRoot)) {
            & icacls.exe $writableRoot /grant:r "${proofUser}:(OI)(CI)M" /T /Q
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the proof account its isolated writable root." }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PNPM_HOME)) {
            & icacls.exe $env:PNPM_HOME /grant:r "${proofUser}:(OI)(CI)RX" /T /Q
            if ($LASTEXITCODE -ne 0) { throw "Could not grant read-only access to the trusted pnpm runtime." }
          }
          $writeDeny = "${proofUser}:(OI)(CI)(WD,AD,WEA,WA,DE,DC,WDAC,WO)"
          foreach ($trustedRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            & icacls.exe $trustedRoot /deny $writeDeny /T /Q
            if ($LASTEXITCODE -ne 0) { throw "Could not protect trusted runner state from the proof account." }
          }
          & icacls.exe ".factory" /deny "${proofUser}:(OI)(CI)F" /T /Q
          if ($LASTEXITCODE -ne 0) { throw "Could not isolate Factory proof state." }
          & icacls.exe "purpose-foundry-workspaces.tar" /deny "${proofUser}:F" /Q
          if ($LASTEXITCODE -ne 0) { throw "Could not isolate the immutable transport archive." }
          "proof_user=$proofUser" >> $env:GITHUB_OUTPUT
          "sandbox_root=$sandboxRoot" >> $env:GITHUB_OUTPUT
          "state_root=$stateRoot" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Execute Windows proof without production secrets
        shell: pwsh
        env:
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_PLATFORM_SANDBOX_ROOT: "${{ steps.proof_sandbox.outputs.sandbox_root }}"
          FACTORY_PLATFORM_PROOF_USER: "${{ steps.proof_sandbox.outputs.proof_user }}"
          FACTORY_PLATFORM_PROOF_STATE_ROOT: "${{ steps.proof_sandbox.outputs.state_root }}"
          FACTORY_PLATFORM_PROOF_WINDOWS_LAUNCHER: "${{ github.workspace }}/scripts/ci/windows-proof-launcher.ps1"
          FACTORY_PLATFORM_PROOF_WINDOWS_PASSWORD: "${{ steps.proof_sandbox.outputs.password }}"
          ALLOW_UNTRUSTED_SCRIPTS: "true"
          CI: "true"
        run: pnpm exec tsx src/cli/factory-platform-proof.ts record

      - name: Stage Windows evidence layout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force platform-evidence -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path platform-evidence | Out-Null
          Copy-Item -Path .factory -Destination platform-evidence/.factory -Recurse -Force

      - name: Preserve Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purpose-foundry-windows-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            platform-evidence/**

  macos:
    name: Verify Purpose Foundry candidate on macOS
    needs: [seed, windows]
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore immutable seed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: purpose-foundry-seed-${{ github.run_id }}
          path: .

      - name: Restore Windows evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: purpose-foundry-windows-${{ github.run_id }}
          path: .

      - name: Materialize immutable candidate
        shell: pwsh
        run: tar --extract --file purpose-foundry-workspaces.tar

      - name: Isolate untrusted macOS proof
        id: proof_sandbox
        shell: bash
        run: |
          proof_user="factoryproof"
          proof_root="/Users/Shared/factory-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sandbox_root="${proof_root}/workspaces"
          state_root="${proof_root}/state"
          runner_gid="$(id -g)"
          proof_uid="$(dscl . -list /Users UniqueID | awk 'BEGIN { max = 600 } $2 > max && $2 < 65000 { max = $2 } END { print max + 1 }')"
          sudo dscl . -create "/Users/${proof_user}"
          sudo dscl . -create "/Users/${proof_user}" RealName "Factory Proof"
          sudo dscl . -create "/Users/${proof_user}" UniqueID "${proof_uid}"
          sudo dscl . -create "/Users/${proof_user}" PrimaryGroupID "${runner_gid}"
          sudo dscl . -create "/Users/${proof_user}" NFSHomeDirectory "${state_root}/home"
          sudo dscl . -create "/Users/${proof_user}" UserShell /usr/bin/false
          sudo dscl . -passwd "/Users/${proof_user}" "$(uuidgen | tr -d '-')aA1!"
          sudo mkdir -p "${sandbox_root}" "${state_root}"/{home,tmp,appdata,localappdata,cache,config,data,corepack,pnpm,npm,yarn,pip,playwright}
          sudo chown -R "$(id -un):${runner_gid}" "${proof_root}"
          sudo chmod 0750 "${proof_root}"
          sudo chmod -R 0770 "${sandbox_root}" "${state_root}"
          sudo chmod -R go-w "${HOME}" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          if [[ -n "${PNPM_HOME:-}" ]]; then
            chmod go+x "${HOME}"
            chmod -R go+rX "${PNPM_HOME}"
          fi
          chmod -R go-rwx .factory
          chmod go-rwx purpose-foundry-workspaces.tar
          {
            echo "proof_user=${proof_user}"
            echo "sandbox_root=${sandbox_root}"
            echo "state_root=${state_root}"
          } >> "${GITHUB_OUTPUT}"

      - name: Execute macOS proof without production secrets
        shell: pwsh
        env:
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_PLATFORM_SANDBOX_ROOT: "${{ steps.proof_sandbox.outputs.sandbox_root }}"
          FACTORY_PLATFORM_PROOF_USER: "${{ steps.proof_sandbox.outputs.proof_user }}"
          FACTORY_PLATFORM_PROOF_STATE_ROOT: "${{ steps.proof_sandbox.outputs.state_root }}"
          ALLOW_UNTRUSTED_SCRIPTS: "true"
          CI: "true"
        run: pnpm exec tsx src/cli/factory-platform-proof.ts record

      - name: Stage macOS evidence layout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force platform-evidence -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path platform-evidence | Out-Null
          Copy-Item -Path .factory -Destination platform-evidence/.factory -Recurse -Force

      - name: Preserve macOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purpose-foundry-macos-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            platform-evidence/**

  verify:
    name: Purpose Foundry end-to-end production verification
    needs: [seed, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore immutable seed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: purpose-foundry-seed-${{ github.run_id }}
          path: .

      - name: Restore cross-platform evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: purpose-foundry-macos-${{ github.run_id }}
          path: .

      - name: Materialize immutable candidate
        shell: bash
        run: tar --extract --file purpose-foundry-workspaces.tar

      - name: Build generated-code verification sandbox
        shell: bash
        run: |
          docker build --pull \
            --file scripts/ci/verification-sandbox.Dockerfile \
            --tag "local-ai-factory-verifier:${GITHUB_SHA}" \
            scripts/ci
          mkdir -p "${RUNNER_TEMP}/factory-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Resume paid Purpose Foundry production line
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PAID_PRODUCTION_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PAID_PRODUCTION_OPENAI_KEY || secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: claude-fable-5-1
          OPENAI_MODEL: gpt-5.5
          FACTORY_SOL_MODEL: gpt-5.5
          FACTORY_FABLE_OR_OPUS_MODEL: claude-fable-5-1
          FACTORY_FREE_ENABLED: "0"
          DEFAULT_CODE_PROVIDER: anthropic
          DEFAULT_REVIEW_PROVIDER: openai
          FACTORY_VERIFICATION_SANDBOX_IMAGE: "local-ai-factory-verifier:${{ github.sha }}"
          FACTORY_VERIFICATION_SANDBOX_STATE_ROOT: "${{ runner.temp }}/factory-verification-${{ github.run_id }}-${{ github.run_attempt }}"
          ALLOW_UNTRUSTED_SCRIPTS: "true"
          PURPOSE_FOUNDRY_LOCAL_ARTIFACT_ONLY: "true"
          PURPOSE_FOUNDRY_SMOKE_PHASE: resume
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_RUN_TIMEOUT_MS: "19200000"
          PURPOSE_FOUNDRY_FACTORY_TIMEOUT_MS: "19200000"
          PURPOSE_FOUNDRY_SMOKE_TIMEOUT_MS: "19200000"
          MAX_MODEL_CALLS_PER_RUN: "60"
          MAX_REPAIR_LOOPS: "3"
          FACTORY_PAID_RESCUES_PER_HOUR: "60"
          FACTORY_PAID_RESCUES_PER_DAY: "60"
          FACTORY_PAID_MAX_USD_PER_DAY: "35"
          CI: "true"
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "No Anthropic production credential is configured."; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "No OpenAI production credential is configured."; exit 1; }
          setsid pnpm server > purpose-foundry-server.log 2>&1 &
          server_pid=$!
          trap 'kill -- "-$server_pid" 2>/dev/null || true' EXIT
          node scripts/ci/run-purpose-foundry-smoke.mjs

      - name: Preserve Purpose Foundry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purpose-foundry-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            purpose-foundry-seed-server.log
            purpose-foundry-server.log
            .factory/**
            workspaces/**
            !workspaces/**/node_modules/**
            !workspaces/**/__pycache__/**
            !workspaces/**/*.pyc
            !workspaces/**/*.pyo
            !workspaces/**/.coverage*
            !workspaces/**/.pytest_cache/**
            !workspaces/**/.mypy_cache/**
            !workspaces/**/.ruff_cache/**
            !workspaces/**/.hypothesis/**
            !workspaces/**/.tox/**
            !workspaces/**/.nox/**
            !workspaces/**/.nyc_output/**

  report:
    name: Publish exact Purpose Foundry proof status
    needs: [seed, windows, macos, verify]
    if: >-
      ${{ always() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
            contains(github.event.head_commit.message, '[foundry-smoke]')) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Bind proof result to the exact main commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROOF_STATE: ${{ needs.verify.result == 'success' && 'success' || 'failure' }}
          PROOF_CONTEXT: purpose-foundry-cloud/exact-main-proof
          PROOF_DESCRIPTION: Purpose Foundry exact-candidate cloud proof
          PROOF_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,
            {
              method: "POST",
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
              },
              body: JSON.stringify({
                state: process.env.PROOF_STATE,
                context: process.env.PROOF_CONTEXT,
                description: process.env.PROOF_DESCRIPTION,
                target_url: process.env.PROOF_TARGET_URL,
              }),
            },
          );
          if (!response.ok) {
            throw new Error(`GitHub status API ${response.status}: ${await response.text()}`);
          }
          NODE
