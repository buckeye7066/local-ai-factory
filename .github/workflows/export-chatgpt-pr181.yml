name: Apply PR 181 production repairs

on:
  push:
    branches: [fix/factory-purpose-evidence-truth-20260904]
    paths:
      - .github/workflows/export-chatgpt-pr181.yml
      - .github/chatgpt-pr181-patch/**
      - .github/chatgpt-pr181-integration/**
      - .github/chatgpt-pr181-cache-fix/**
      - .github/chatgpt-pr181-suite-isolation/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr181-production-repairs
  cancel-in-progress: false

jobs:
  apply-repair:
    name: apply, verify, and commit exact-head repairs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assemble and authenticate the primary repair patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/chatgpt-pr181-patch/part-* > "$RUNNER_TEMP/repair.raw"
          python3 - "$RUNNER_TEMP/repair.raw" "$RUNNER_TEMP/repair.patch" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          text = "\n".join(
              line[1:] if line.startswith(" diff --git ") else line
              for line in text.split("\n")
          )
          marker = "+diff --git a/src/server/tools/webFetch.ts"
          start = text.index(marker)
          end = text.index("\n-  const zeroSizedAndClipped", start)
          segment = text[start:end]
          segment = "\n".join(
              line[1:] if line.startswith("+") else line
              for line in segment.split("\n")
          )
          Path(sys.argv[2]).write_text(
              text[:start] + segment + text[end:],
              encoding="utf-8",
          )
          PY
          echo "93851396a363b2f98d14cc75fea8f326becbd7ca4c33e845e26e34aaedb8c137  $RUNNER_TEMP/repair.patch" | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"

      - name: Assemble and authenticate the integration repair
        shell: bash
        run: |
          set -euo pipefail
          cat .github/chatgpt-pr181-integration/part-* > "$RUNNER_TEMP/integration.raw"
          python3 - "$RUNNER_TEMP/integration.raw" "$RUNNER_TEMP/integration.patch" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          duplicate = (
              " ? FS.O_NOFOLLOW : 0);\n"
              "   const handle = await open(path, flags, 0o600);\n"
          )
          if duplicate not in text:
              raise SystemExit("integration boundary duplicate was not found")
          text = text.replace(duplicate, "", 1)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          PY
          echo "b1de4ac4ea5e3374f820a0f9d0353cee09a50e559392dda8632baf8ae01d3f6f  $RUNNER_TEMP/integration.patch" | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/integration.patch"
          git apply "$RUNNER_TEMP/integration.patch"

      - name: Authenticate and apply the ticket-cache repair
        shell: bash
        run: |
          set -euo pipefail
          cp .github/chatgpt-pr181-cache-fix/patch.diff "$RUNNER_TEMP/cache-fix.patch"
          echo "614fc05e19fe917e060e7d93cf6e6b1b7d6870ec7f446e5e49951f9666996569  $RUNNER_TEMP/cache-fix.patch" | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/cache-fix.patch"
          git apply "$RUNNER_TEMP/cache-fix.patch"

      - name: Assemble and authenticate singleton-suite isolation
        shell: bash
        run: |
          set -euo pipefail
          suite_source=.github/chatgpt-pr181-suite-isolation/patch.diff
          test "$(git hash-object "$suite_source")" = "42de8f9720d13975adfee85fb67c4b259ed4cf3c"
          cp "$suite_source" "$RUNNER_TEMP/suite.raw"
          python3 - "$RUNNER_TEMP/suite.raw" "$RUNNER_TEMP/suite.patch" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = "+diff --git a/src/server/__tests__/processFileLock.test.ts"
          if text.count(marker) != 1:
              raise SystemExit("suite patch boundary marker was not unique")
          start = text.index(marker)
          segment = "\n".join(
              line[1:] if line.startswith("+") else line
              for line in text[start:].split("\n")
          )
          normalized = text[:start] + segment
          if normalized.count("diff --git ") != 3:
              raise SystemExit("suite patch did not normalize to exactly three file diffs")
          Path(sys.argv[2]).write_text(normalized, encoding="utf-8")
          PY
          git apply --check "$RUNNER_TEMP/suite.patch"
          git apply "$RUNNER_TEMP/suite.patch"

      - name: Remove one-time transfer machinery
        shell: bash
        run: |
          rm -rf .github/chatgpt-pr181-patch
          rm -rf .github/chatgpt-pr181-integration
          rm -rf .github/chatgpt-pr181-cache-fix
          rm -rf .github/chatgpt-pr181-suite-isolation
          rm -f .github/workflows/export-chatgpt-pr181.yml
          rm -f .github/workflows/hash-pr181-parts.yml

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.17.0"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and stage the candidate revision
        shell: bash
        run: |
          pnpm format
          git diff --check
          git add -A
          git diff --cached --check

      - name: Typecheck both TypeScript projects
        run: pnpm typecheck

      - name: Verify source formatting
        run: pnpm lint

      - name: Run the complete unit suite
        run: pnpm test

      - name: Run executable release controls against the staged revision
        run: pnpm release:check

      - name: Commit and push the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close PR 181 production evidence gaps"
          git push origin HEAD:fix/factory-purpose-evidence-truth-20260904
