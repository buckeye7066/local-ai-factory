name: Export PR 181 repair source

on:
  push:
    branches: [fix/factory-purpose-evidence-truth-20260904]
    paths:
      - .github/workflows/export-chatgpt-pr181.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package exact branch source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/pr181-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: local-ai-factory-pr181-source
          path: ${{ runner.temp }}/pr181-source.tar.gz
          retention-days: 1
          if-no-files-found: error
