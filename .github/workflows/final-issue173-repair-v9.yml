name: final-issue173-repair-v9

on:
  push:
    branches: [audit/final-zero-known-defects-20260903]
    paths: [.github/workflows/final-issue173-repair-v9.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Regenerate lockfile for patched overrides
        run: pnpm install --lockfile-only

      - name: Install exact patched dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove patched dependency versions
        shell: bash
        run: |
          pnpm why browserslist
          pnpm why qs
          if pnpm why browserslist | grep -Eq 'browserslist 4\.28\.[0-6](\s|$)'; then
            echo 'Vulnerable Browserslist remains in the dependency graph.' >&2
            exit 1
          fi
          if pnpm why qs | grep -Eq 'qs (?:[0-5]\.|6\.(?:[0-9]|1[0-5])(?:\.|$))'; then
            echo 'Vulnerable qs remains in the dependency graph.' >&2
            exit 1
          fi

      - name: Zero-known-vulnerability dependency audit
        shell: bash
        run: timeout 120s pnpm audit --audit-level low

      - name: Remove obsolete import from issue repair script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/final-issue173-repair.mjs')
          text = path.read_text()
          old = '''  `import {\\n  ProductSpecObjectSchema,\\n  ProductSpecSchema,\\n  type ProductSpec,`,'''
          new = '''  `import {\\n  ProductSpecObjectSchema,\\n  type ProductSpec,`,'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one product-spec import replacement, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply issue 173 code repairs
        run: node scripts/final-issue173-repair.mjs

      - name: Align existing Vitest-config regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/__tests__/verificationCommands.test.ts')
          text = path.read_text()
          old = '''        "src/profile flow.test.ts",
                  "--reporter=json",
                  "--root=packages/web app",'''
          new = '''        "src/profile flow.test.ts",
                  "--config=vitest.config.ts",
                  "--reporter=json",
                  "--root=packages/web app",'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one candidate-config assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove developer-specific machine paths
        run: node scripts/final-portability-hygiene.mjs

      - name: Format complete TypeScript tree
        run: pnpm exec prettier --write "src/**/*.{ts,tsx}"

      - name: Prove developer username is absent
        shell: bash
        run: |
          if git grep -n -i 'firer' -- .; then
            echo 'Developer-specific username remains in tracked repository content.' >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Focused corrected-contract regressions
        run: >-
          pnpm vitest run
          src/server/__tests__/issue173Correctness.test.ts
          src/server/__tests__/verificationCommands.test.ts
          src/server/__tests__/commandSandbox.test.ts
          src/server/__tests__/checkpointEvidenceBounds.test.ts
          src/server/__tests__/platformEvidenceRunner.test.ts
          src/server/__tests__/productSpecCoercion.test.ts
          src/server/__tests__/webResearch.test.ts
          src/server/__tests__/repoHygiene.test.ts
          src/server/__tests__/foundry.test.ts
          src/server/__tests__/deleteAndDeliver.test.ts
          src/server/__tests__/projectRoster.test.ts
          src/server/__tests__/purposeFoundryLauncher.test.ts

      - name: Full unit suite
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Remove temporary audit machinery before release checks
        shell: bash
        run: |
          rm -f \
            .github/workflows/final-audit-integration.yml \
            .github/workflows/final-issue173-repair.yml \
            .github/workflows/final-issue173-repair-v2.yml \
            .github/workflows/final-issue173-repair-v3.yml \
            .github/workflows/final-issue173-repair-v4.yml \
            .github/workflows/final-issue173-repair-v5.yml \
            .github/workflows/final-issue173-repair-v6.yml \
            .github/workflows/final-issue173-repair-v7.yml \
            .github/workflows/final-issue173-repair-v8.yml \
            .github/workflows/final-issue173-repair-v9.yml \
            scripts/final-issue173-repair.mjs \
            scripts/final-portability-hygiene.mjs

      - name: Build
        run: pnpm build

      - name: Release check
        run: pnpm release:check

      - name: Re-audit final dependency graph
        shell: bash
        run: timeout 120s pnpm audit --audit-level low

      - name: Publish only fully verified code repairs
        shell: bash
        run: |
          git config user.name "Factory Deck Audit"
          git config user.email "factory-deck-audit@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified repair changes were produced." >&2
            exit 1
          fi
          git commit -m "Fix issue 173 correctness, portability, and dependency defects"
          git push origin HEAD:audit/final-zero-known-defects-20260903
