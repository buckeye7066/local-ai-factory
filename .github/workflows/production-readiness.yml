name: production-readiness

on:
  push:
    branches: [main, "release-gate/**", "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: release:check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Required executable controls present
        shell: pwsh
        run: |
          $required = @(
            "docs/purpose-contract.md",
            ".github/workflows/production-readiness.yml",
            "scripts/release-check.mjs",
            "src/server/__tests__/providerAbort.test.ts",
            "package.json"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "missing required control: $p" }
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.scripts.'release:check') { throw "package.json missing release:check script" }

      - name: Typecheck
        run: pnpm typecheck

      - name: Full unit test suite
        run: pnpm test

      - name: release:check
        run: pnpm release:check
