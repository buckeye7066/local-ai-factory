name: factory-deck-cloud
run-name: "Factory Deck cloud proof @ ${{ github.sha }} (attempt ${{ github.run_attempt }})"
# A marker-bearing main commit starts the exact automatic-ladder proof; skipped runs are never evidence.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      idea:
        description: What should Factory Deck build?
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed:
    name: Generate exact Factory Deck candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[factory-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Factory Deck
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install Factory Deck
        run: pnpm install --frozen-lockfile

      - name: Provision AI Time terminal free rung
        shell: bash
        run: bash scripts/ci/provision-aitime-free-fallback.sh

      - name: Build generated-code verification sandbox
        shell: bash
        run: |
          docker build --pull \
            --file scripts/ci/verification-sandbox.Dockerfile \
            --tag "local-ai-factory-verifier:${GITHUB_SHA}" \
            scripts/ci
          mkdir -p "${RUNNER_TEMP}/factory-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # A CLI candidate is expected to stop at the mandatory cross-platform
      # gate after its Linux build. Only the validator below may convert that
      # non-zero exit into a resumable fan-out; every other failure stays red.
      - name: Build and verify candidate on Linux
        id: candidate
        continue-on-error: true
        shell: pwsh
        env:
          FACTORY_IDEA: ${{ inputs.idea || 'Build and verify a minimal TypeScript command-line task checklist. It must be command-line only with no HTML, browser, or web UI; support add, list, complete, and delete commands; persist tasks in a local JSON file; and include automated tests for the complete primary workflow.' }}
          FACTORY_PROJECT_ID: "factory-deck-cloud-proof"
          ANTHROPIC_API_KEY: ${{ secrets.PAID_PRODUCTION_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PAID_PRODUCTION_OPENAI_KEY || secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: claude-fable-5-1
          OPENAI_MODEL: gpt-5.5
          FACTORY_SOL_MODEL: gpt-5.5
          FACTORY_FABLE_OR_OPUS_MODEL: claude-fable-5-1
          FACTORY_FREE_ENABLED: "1"
          DEFAULT_CODE_PROVIDER: anthropic
          DEFAULT_REVIEW_PROVIDER: openai
          FACTORY_VERIFICATION_SANDBOX_IMAGE: "local-ai-factory-verifier:${{ github.sha }}"
          FACTORY_VERIFICATION_SANDBOX_STATE_ROOT: "${{ runner.temp }}/factory-verification-${{ github.run_id }}-${{ github.run_attempt }}"
          ALLOW_UNTRUSTED_SCRIPTS: "true"
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_RUN_TIMEOUT_MS: "19200000"
          MAX_MODEL_CALLS_PER_RUN: "60"
          MAX_REPAIR_LOOPS: "3"
          FACTORY_PAID_RESCUES_PER_HOUR: "60"
          FACTORY_PAID_RESCUES_PER_DAY: "60"
          FACTORY_PAID_MAX_USD_PER_DAY: "35"
          CI: "true"
        run: pnpm exec tsx src/cli/factory.ts

      - name: Validate platform-only readiness hold
        shell: pwsh
        env:
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
        run: |
          if ("${{ steps.candidate.outcome }}" -ne "failure") {
            throw "The Linux seed did not stop at the expected cross-platform gate."
          }
          pnpm exec tsx src/cli/factory-platform-proof.ts validate

      - name: Pack immutable candidate with POSIX metadata
        shell: bash
        run: |
          tar --create --file factory-deck-workspaces.tar \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/__pycache__' \
            --exclude='*/__pycache__/*' \
            --exclude='*/.pytest_cache' \
            --exclude='*/.pytest_cache/*' \
            --exclude='*/.mypy_cache' \
            --exclude='*/.mypy_cache/*' \
            --exclude='*/.ruff_cache' \
            --exclude='*/.ruff_cache/*' \
            --exclude='*/.hypothesis' \
            --exclude='*/.hypothesis/*' \
            --exclude='*/.tox' \
            --exclude='*/.tox/*' \
            --exclude='*/.nox' \
            --exclude='*/.nox/*' \
            --exclude='*/.nyc_output' \
            --exclude='*/.nyc_output/*' \
            --exclude='*/.coverage' \
            --exclude='*/.coverage.*' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            workspaces

      - name: Preserve exact candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-deck-seed-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            .factory/**
            factory-deck-workspaces.tar

  windows:
    name: Verify exact candidate on Windows
    needs: seed
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Factory Deck
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install Factory Deck
        run: pnpm install --frozen-lockfile

      - name: Restore exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-deck-seed-${{ github.run_id }}
          path: .

      - name: Materialize immutable candidate
        shell: pwsh
        run: tar --extract --file factory-deck-workspaces.tar

      - name: Execute Windows proof without production secrets
        shell: pwsh
        run: ./scripts/ci/run-windows-platform-proof.ps1 -WorkspaceRoot "${{ github.workspace }}/workspaces"

      - name: Stage Windows checkpoint evidence
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force platform-evidence -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path platform-evidence | Out-Null
          Copy-Item -Path .factory -Destination platform-evidence/.factory -Recurse -Force

      - name: Preserve Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-deck-windows-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            platform-evidence/**

  macos:
    name: Verify exact candidate on macOS
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Factory Deck
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install Factory Deck
        run: pnpm install --frozen-lockfile

      - name: Restore immutable seed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-deck-seed-${{ github.run_id }}
          path: .

      - name: Restore Windows checkpoint evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-deck-windows-${{ github.run_id }}
          path: platform-evidence

      - name: Materialize immutable candidate
        shell: bash
        run: tar --extract --file factory-deck-workspaces.tar

      - name: Apply Windows checkpoint evidence
        shell: bash
        run: |
          rm -rf .factory
          cp -R platform-evidence/.factory .factory

      - name: Execute macOS proof without production secrets
        shell: bash
        run: bash scripts/ci/run-macos-platform-proof.sh "${{ github.workspace }}/workspaces"

      - name: Stage macOS checkpoint evidence
        if: always()
        shell: bash
        run: |
          rm -rf platform-evidence
          mkdir -p platform-evidence
          cp -R .factory platform-evidence/.factory

      - name: Preserve macOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-deck-macos-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            platform-evidence/**

  build:
    name: Factory Deck cloud build
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Factory Deck
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Install Factory Deck
        run: pnpm install --frozen-lockfile

      - name: Provision AI Time terminal free rung
        shell: bash
        run: bash scripts/ci/provision-aitime-free-fallback.sh

      - name: Restore immutable seed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-deck-seed-${{ github.run_id }}
          path: .

      - name: Restore macOS checkpoint evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-deck-macos-${{ github.run_id }}
          path: platform-evidence

      - name: Materialize immutable candidate
        shell: bash
        run: tar --extract --file factory-deck-workspaces.tar

      - name: Apply macOS checkpoint evidence
        shell: bash
        run: |
          rm -rf .factory
          cp -R platform-evidence/.factory .factory

      - name: Finalize automatic-ladder readiness on exact candidate
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PAID_PRODUCTION_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PAID_PRODUCTION_OPENAI_KEY || secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: claude-fable-5-1
          OPENAI_MODEL: gpt-5.5
          FACTORY_SOL_MODEL: gpt-5.5
          FACTORY_FABLE_OR_OPUS_MODEL: claude-fable-5-1
          FACTORY_FREE_ENABLED: "1"
          DEFAULT_CODE_PROVIDER: anthropic
          DEFAULT_REVIEW_PROVIDER: openai
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_RUN_TIMEOUT_MS: "19200000"
          MAX_MODEL_CALLS_PER_RUN: "60"
          MAX_REPAIR_LOOPS: "3"
          FACTORY_PAID_RESCUES_PER_HOUR: "60"
          FACTORY_PAID_RESCUES_PER_DAY: "60"
          FACTORY_PAID_MAX_USD_PER_DAY: "35"
          CI: "true"
        run: pnpm exec tsx src/cli/factory-resume.ts

      - name: Preserve Factory Deck result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-deck-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          retention-days: 14
          path: |
            .factory/**
            workspaces/**
            !workspaces/**/node_modules/**
