name: PR 89 corrected runtime integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr89-integrate-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: >-
      github.event.pull_request.number == 89 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mandatory-production-readiness-brains'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/mandatory-production-readiness-brains
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.0
      - run: pnpm install --frozen-lockfile
      - run: python scripts/pr89-runtime-integrate.py
      - name: Format integrated runtime files
        run: >-
          pnpm exec prettier --write
          src/server/orchestrator/runFactory.ts
          src/server/orchestrator/productionReadinessPolicy.ts
          src/server/orchestrator/completeProductionReadiness.ts
          src/server/storage/auditLog.ts
          src/server/foundry/model.ts
          src/server/foundry/router.ts
          src/server/foundry/adapters.ts
          src/server/foundry/readinessPolicy.ts
      - run: pnpm typecheck
      - name: Run mandatory readiness tests
        run: >-
          pnpm exec vitest run
          src/server/__tests__/productionReadinessPolicy.test.ts
          src/server/__tests__/productionReadinessAgent.test.ts
          src/server/__tests__/readinessBrainFloor.test.ts
          src/server/__tests__/readinessStore.test.ts
          src/server/__tests__/foundryReadinessPolicy.test.ts
      - name: Commit integrated runtime
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Runtime already integrated.'
            exit 0
          fi
          git config user.name 'factory-readiness-integrator'
          git config user.email 'factory-readiness-integrator@users.noreply.github.com'
          git add -- \
            src/server/orchestrator/runFactory.ts \
            src/server/orchestrator/productionReadinessPolicy.ts \
            src/server/orchestrator/completeProductionReadiness.ts \
            src/server/storage/auditLog.ts \
            src/server/foundry/model.ts \
            src/server/foundry/router.ts \
            src/server/foundry/adapters.ts \
            src/server/foundry/readinessPolicy.ts
          git commit -m 'feat(readiness): enforce receipts in Factory Deck and Purpose Foundry'
          git push origin HEAD:feat/mandatory-production-readiness-brains
