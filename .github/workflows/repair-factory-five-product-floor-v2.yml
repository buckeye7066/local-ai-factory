name: Factory five-product repair v2
on:
  push:
    branches: [fix/factory-cloud-five-product-floor-20260905]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[factory-five-product-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/factory-cloud-five-product-floor-20260905
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: "10.17.0"
      - name: Edit product discovery and evidence recovery
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/server/tools/competitiveIntelligence.ts')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'const queries = productQueries.length')
          end = next(i for i in range(start, start + 10) if lines[i].strip() == ': defaultQueries;')
          block = [
            '  const deterministicProductQueries = defaultQueries.filter((query) =>',
            '    isCompetitorQuery(query),',
            '  );',
            '  const implementationQueries = defaultQueries.filter(',
            '    (query) => !isCompetitorQuery(query),',
            '  );',
            '  const queries = productQueries.length',
            '    ? [',
            '        ...new Set([',
            '          ...productQueries,',
            '          ...deterministicProductQueries,',
            '          ...implementationQueries,',
            '        ]),',
            '      ].slice(0, 12)',
            '    : defaultQueries;',
          ]
          lines[start:end + 1] = block
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('src/server/agents/researchAgent.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
            '    if (suppliedEvidence.size === 0) return undefined;',
            '    if (suppliedEvidence.size === 0) {\n      return reviewCandidates.length === 1 ? reviewCandidates[0]!.id : undefined;\n    }',
            1,
          )
          text = text.replace(
            '    return evidenceMatches.length === 1 ? evidenceMatches[0]!.id : undefined;',
            '    if (evidenceMatches.length === 1) return evidenceMatches[0]!.id;\n    return reviewCandidates.length === 1 ? reviewCandidates[0]!.id : undefined;',
            1,
          )
          text = text.replace(
            '      const inspectedEvidence = evidenceByCandidate.get(comparison.candidateId);',
            '      const candidate = candidates.find((item) => item.id === comparison.candidateId);\n      const inspectedEvidence = canonicalEvidenceUrlSet(\n        candidate?.sourceEvidence.map((item) => item.url) ?? [],\n      );',
            1,
          )
          p.write_text(text, encoding='utf-8')

          Path('.github/workflows/repair-factory-five-product-floor.yml').unlink(missing_ok=True)
          Path('.github/workflows/repair-factory-five-product-floor-v2.yml').unlink()
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/server/__tests__/webResearch.test.ts src/server/__tests__/boundedResearch.test.ts src/server/__tests__/competitiveEvidence.test.ts
          pnpm typecheck
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(factory): preserve deterministic five-product discovery floor [factory-five-product-repair]"
          git push origin HEAD:fix/factory-cloud-five-product-floor-20260905
