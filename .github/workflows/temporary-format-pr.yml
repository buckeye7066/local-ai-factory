name: temporary-format-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.17.0"
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          src/server/orchestrator/runFactory.ts
          src/cli/factory.ts
          src/server/foundry/router.ts
          src/ui/components/factory/NewRunHero.tsx
          src/ui/components/factory/NewRunRouting.test.tsx
          src/server/providers/index.ts
          src/server/foundry/adapters.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-source-2
          path: |
            src/server/orchestrator/runFactory.ts
            src/cli/factory.ts
            src/server/foundry/router.ts
            src/ui/components/factory/NewRunHero.tsx
            src/ui/components/factory/NewRunRouting.test.tsx
            src/server/providers/index.ts
            src/server/foundry/adapters.ts
