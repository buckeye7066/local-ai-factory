name: iplay-paid-planning-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iplay-paid-production-run
  cancel-in-progress: false

jobs:
  factory-deck:
    name: Factory Deck — IPlay planning (execution safety-held)
    if: github.ref == 'refs/heads/main'
    # A dedicated environment isolates the two PAID_PRODUCTION_* secrets from
    # every other workflow job. The job-level main condition is the branch
    # boundary; this environment must not carry a person-based deployment rule.
    environment: paid-production-main-automated
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Factory Deck job
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.17.0"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Factory Deck
        run: pnpm install --frozen-lockfile

      - name: Confirm paid provider credentials
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PAID_PRODUCTION_ANTHROPIC_KEY }}
          OPENAI_API_KEY: ${{ secrets.PAID_PRODUCTION_OPENAI_KEY }}
        run: |
          if (-not $env:ANTHROPIC_API_KEY) { throw "ANTHROPIC_API_KEY is not available to this workflow." }
          if (-not $env:OPENAI_API_KEY) { throw "OPENAI_API_KEY is not available to this workflow." }
          Write-Host "Both paid provider credentials are available (values not displayed)."

      - name: Build IPlay plan and artifacts (generated scripts held)
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PAID_PRODUCTION_ANTHROPIC_KEY }}
          OPENAI_API_KEY: ${{ secrets.PAID_PRODUCTION_OPENAI_KEY }}
          FACTORY_FREE_ENABLED: "0"
          DEFAULT_CODE_PROVIDER: "anthropic"
          DEFAULT_REVIEW_PROVIDER: "openai"
          # Provider credentials and a network-enabled runner are present in
          # this step, so generated project code must not execute here. The run
          # will hold at verification rather than expose CI secrets to code
          # authored during the same job.
          ALLOW_UNTRUSTED_SCRIPTS: "false"
          FACTORY_ACCEPT_SAFETY_HOLD: "true"
          WORKSPACE_ROOT: "${{ github.workspace }}/workspaces"
          FACTORY_RUN_TIMEOUT_MS: "21000000"
          MAX_MODEL_CALLS_PER_RUN: "60"
          MAX_REPAIR_LOOPS: "3"
          FACTORY_PAID_RESCUES_PER_HOUR: "60"
          FACTORY_PAID_RESCUES_PER_DAY: "60"
          FACTORY_PAID_MAX_USD_PER_DAY: "35"
          CI: "true"
        run: pnpm exec tsx scripts/ci/run-iplay-job.ts

      - name: Preserve Factory Deck evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iplay-factory-deck-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            jobs/iplay/run-result.json
            .factory/**
            workspaces/**
